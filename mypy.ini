[mypy]
# The current optional NumPy stubs require Python 3.12 syntax; the runtime
# package still declares Python >=3.10 and the checked modules use 3.10 syntax.
python_version = 3.12
strict = True
files = sdk/unifile_sdk, unifile/classifier.py, unifile/learning.py, unifile/semantic.py, unifile/tagging/library.py
follow_imports = skip
ignore_missing_imports = True
warn_unused_ignores = True
