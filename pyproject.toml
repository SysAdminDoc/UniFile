[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifile"
version = "9.3.32"
description = "Unified AI-powered file organization platform — tag library, 7-level classification, LLM intelligence, cleanup, dedup, photo library."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SysAdminDoc" }]
keywords = ["file-organizer", "tag-library", "ollama", "pyqt6", "ai", "classification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt6>=6.5",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
# Extras kept aligned with unifile/bootstrap.py optional imports.
full = [
    "Pillow>=12.2.0",
    "pillow-heif>=1.4.0",
    "exifread>=3.5.1",
    "mutagen>=1.48.1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "psd-tools>=1.17.4",
    "rarfile>=4.2",
    "py7zr>=1.1.3",
    "rapidfuzz>=3.14.5",
    "unidecode>=1.4.0",
    "reverse_geocoder>=1.5.1",
    "opencv-python-headless>=4.13.0.92",
    "send2trash>=2.1.0",
    "guessit>=4.0.2",
    "requests>=2.34.2",
    "requests-cache>=1.3.2",
    "Flask>=3.1.0",
    "babelfish>=0.6.1",
    "pydantic>=2.13.4",
    "platformdirs>=4.10.0",
    "PyYAML>=6.0.3",
    "tomli>=2.4.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "pyacoustid>=1.3.1",
    "musicbrainzngs>=0.7.1",
    "pytesseract>=0.3.13",
    "easyocr>=1.7.2",
    "pdfminer.six>=20260107",
    "pymupdf>=1.28.0",
    "pdf2image>=1.17.0",
    "isbnlib2>=3.11.7",
]
face = ["cmake", "dlib", "face_recognition"]
nexa = ["nexaai"]
media = ["mutagen>=1.48.1", "pyacoustid>=1.3.1", "musicbrainzngs>=0.7.1"]
ocr = ["pytesseract>=0.3.13", "easyocr>=1.7.2", "pdfminer.six>=20260107", "pymupdf>=1.28.0", "pdf2image>=1.17.0"]
onnx = ["onnxruntime>=1.20.0", "tokenizers>=0.20.0", "numpy>=1.26.0", "Pillow>=12.2.0"]
onnx-gpu = ["onnxruntime-gpu>=1.20.0", "tokenizers>=0.20.0", "numpy>=1.26.0", "Pillow>=12.2.0"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-qt>=4",
    "ruff>=0.5",
    "pip-audit>=2.10",
    "packaging>=25",
]

[project.scripts]
unifile = "unifile.__main__:main"

[project.urls]
Homepage = "https://github.com/SysAdminDoc/UniFile"
Repository = "https://github.com/SysAdminDoc/UniFile"
Issues = "https://github.com/SysAdminDoc/UniFile/issues"
Changelog = "https://github.com/SysAdminDoc/UniFile/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["unifile*"]
exclude = ["tests*", "build*", "dist*"]

# ── Testing ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests that take several seconds (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests that require external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:face_recognition.*",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["unifile"]
omit = [
    "unifile/__main__.py",
    "unifile/widgets.py",        # Qt widgets — not unit-testable
    "unifile/main_window.py",    # Monolithic UI entry point
    "unifile/dialogs/*",         # All Qt dialogs
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ── Linting ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — long Qt stylesheets and SQL strings are common
    "E701",  # multiple-statements-on-one-line-colon — dense-output style preference
    "E702",  # multiple-statements-on-one-line-semicolon — dense-output style preference
    "E401",  # multiple-imports-on-one-line — dense-output style preference
    "B008",  # function calls in default arg (acceptable for Qt default widgets)
    "B904",  # raise-from — verbose to retrofit across the codebase
    "B007",  # unused-loop-control-variable — noisy for enumerate-based patterns
]

[tool.ruff.lint.per-file-ignores]
"unifile/__init__.py" = ["F401"]
"unifile/bootstrap.py" = ["F401", "E402"]  # conditional imports after _bootstrap()
"unifile/dialogs/__init__.py" = ["F401"]
"tests/*.py" = ["F401"]
